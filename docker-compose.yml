services:
   web:
      build:
         context: .
         dockerfile: Dockerfile
      container_name: nextjs_web
      ports:
         - "3000:3000"
      env_file:
         - .env
      depends_on:
         - llm
         - db
      networks:
         - app_network

   db:
      image: postgres:15
      container_name: postgres_db
      restart: unless-stopped
      environment:
         POSTGRES_USER: wimas
         POSTGRES_PASSWORD: secretpassword
         POSTGRES_DB: wimasdb
      volumes:
         - postgres-data:/var/lib/postgresql/data
      networks:
         - app_network
      ports:
         - "5433:5432"

   llm:
      build:
         context: ./python-script
         dockerfile: Dockerfile
      container_name: llm_service
      ports:
         - "8000:8000"
      env_file:
         - ./python-script/.env
      networks:
         - app_network

volumes:
   postgres-data:

networks:
   app_network:
      driver: bridge
